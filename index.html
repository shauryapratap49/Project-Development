<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">amazon</div>

        <div class="search-box">
            <input type="text" placeholder="Search Amazon">
            <button>Search</button>
        </div>

        <div class="nav-links">
            <a href="#">Account</a>
            <a href="#">Orders</a>
            <a href="#">Cart</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Amazon Clone</h1>
        <p>Shop Millions of Products</p>
    </section>

    <!-- Products -->
    <section class="products">

        <div class="card">
            <img src="https://picsum.photos/250/200?1" alt="">
            <h3>Smartphone</h3>
            <p>₹49,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/200?2" alt="">
            <h3>Laptop</h3>
            <p>₹79,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/200?3" alt="">
            <h3>Headphones</h3>
            <p>₹2,999</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/250/200?4" alt="">
            <h3>Smart Watch</h3>
            <p>₹4,999</p>
            <button>Add to Cart</button>
        </div>

    </section>

    <!-- Footer -->
    <footer>
    </footer>

</body>
</html>
